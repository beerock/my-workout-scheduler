name: Booking Automation

on:
  # Triggered by Inngest when booking window opens
  workflow_dispatch:
    inputs:
      class_id:
        description: 'Class ID to book (if not provided, books all classes)'
        required: false
        type: string

jobs:
  book-classes:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Puppeteer browsers
        run: npx puppeteer browsers install chrome

      - name: Run booking automation (single class)
        if: ${{ inputs.class_id != '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        run: npx tsx scripts/test-single-booking.ts ${{ inputs.class_id }}

      - name: Run booking automation (all classes)
        if: ${{ inputs.class_id == '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        run: npx tsx scripts/run-booking-automation.ts

      - name: Upload screenshots (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: booking-screenshots
          path: screenshots/
          retention-days: 7
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          echo "## Booking Automation Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ inputs.class_id }}" ]; then
            echo "✅ Single class booking completed (ID: ${{ inputs.class_id }})" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ Automation completed for all classes" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check the logs above for detailed results." >> $GITHUB_STEP_SUMMARY


